name: Send test alert

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send a test message
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "FAIL: a secret is missing or empty."
            exit 1
          fi
          RESP=$(curl -s -X POST \
            "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT}" \
            -d text="hoopwatch test - if you can read this, alerts work.")
          echo "$RESP" | sed -E 's/[0-9]{8,}/[hidden]/g'
          if echo "$RESP" | grep -q '"ok":true'; then
            echo "SUCCESS - check your phone."
            exit 0
          fi
          if echo "$RESP" | grep -q "404"; then
            echo "FAIL: token is wrong or revoked."
          elif echo "$RESP" | grep -qi "chat not found"; then
            echo "FAIL: chat ID is wrong, or you never messaged the bot."
          else
            echo "FAIL: see response above."
          fi
          exit 1
